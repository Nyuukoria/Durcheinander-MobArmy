name: Build Spigot plugin
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn --batch-mode clean verify
      - run: python3 tools/build_pack.py
      - run: python3 tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: DurcheinanderMobArmy-26.3
          path: |
            target/DurcheinanderMobArmy-1.0.0.jar
            target/MobArmy-resource-pack-26.3.zip
            target/DurcheinanderMobArmy-1.0.0-local-test.zip
