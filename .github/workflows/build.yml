name: Build Spigot plugin
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify fresh and existing demo settings
        shell: powershell
        run: .\tools\test_demo_settings.ps1
      - name: Download and verify private Java, Git and Bash
        shell: powershell
        run: .\local-test\setup.ps1 -DependenciesOnly
      - name: Verify repeat setup works without downloads
        shell: powershell
        run: |
          function global:Invoke-RestMethod { throw 'Unexpected metadata request on repeat setup' }
          function global:Invoke-WebRequest { throw 'Unexpected download on repeat setup' }
          .\local-test\setup.ps1 -DependenciesOnly
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: python3 tools/build_pack.py
      - run: mvn --batch-mode clean verify
      - run: python3 tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: DurcheinanderMobArmy-26.3
          path: |
            target/DurcheinanderMobArmy-1.5.0.jar
            target/MobArmy-resource-pack-26.3.zip
            target/DurcheinanderMobArmy-1.5.0-local-test.zip
