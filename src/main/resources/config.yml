# Demo v3: compact separate preparation room and roofed 100x100 landscape.
configuration-version: 3
timezone: Europe/Berlin
entry-timeout-seconds: 120
loot-timeout-seconds: 120
stage-loot-timeout-seconds: 12
wave-delay-seconds: 4
wipe-cooldown-minutes: 30
ritual-world: world
maximum-ritual-mobs: 20
testing:
  solo: false
  disable-pvp: false
  disable-wipe-cooldown: false
  local-resource-pack: false
balance:
  hit-cap: 0.2
  mace-cap: 0.05
  count-per-extra-player: 0.25
  health-per-extra-player: 0.04
  maximum-wave-mobs: 250
  minimum-spawn-distance: 8
  maximum-build-height: 2
  pearl-cooldown-seconds: 10
  apple-cooldown-seconds: 30
  apples-per-stage: 3
  potions-per-stage: 3
  totems-per-stage: 1
  wind-charge-multiplier: 0.65
  wind-charge-max-horizontal: 0.9
  wind-charge-max-upward: 0.75
messages:
  join: '&dEine Gruppe hat das Portal betreten'
  stage: '&dStage {stage} ist abgeschlossen'
  private-join: '&dWillkommen im Vorraum! &fMach &e/raid &fum den Leader zu wählen. Nur der Leader startet die Stage mit Ready.'
items:
  chaos_fragment:
    material: AMETHYST_SHARD
    name: '&dChaosfragment'
    lore:
    - '&8Wiederverwendbarer Ritual-Katalysator'
    - '&7Rechtsklick auf einen Kessel in der Default-Welt.'
    - '&dErweckt einen Wächter nach 6 Sekunden.'
    - '&7Bleibt erhalten · Abklingzeit: 120 Sekunden.'
    item-model: mobarmy:chaos_fragment
    drops:
    - source: miniboss
      stage: 1
      amount: 1
      chance: 1.0
    ritual:
      type: HUSK
      health: 80
      damage: 6
      name: '&5Fragmentwächter'
      result: ritual_core
      consume: 0
      cooldown-seconds: 120
  ritual_core:
    material: HEART_OF_THE_SEA
    name: '&bRitualkern'
    lore:
    - '&8Wiederverwendbares Schutzrelikt'
    - '&7Rechtsklick: Resistenz I + Regeneration I (8s).'
    - '&bAbklingzeit: 60 Sekunden.'
    - '&7Bleibt bei jeder Benutzung erhalten.'
    item-model: mobarmy:ritual_core
    use:
      consume: 0
      radius: 0
      cooldown-seconds: 60
      message: '&bDer Ritualkern schützt und heilt dich.'
      effects:
      - type: RESISTANCE
        seconds: 8
        amplifier: 0
      - type: REGENERATION
        seconds: 8
        amplifier: 0
  chaos_crown:
    material: NETHER_STAR
    name: '&6Krone des Durcheinanders'
    lore:
    - '&8Wiederverwendbares Gruppenrelikt'
    - '&7Rechtsklick: Tempo I + Eile I (10s).'
    - '&dWirkt auf deine Gruppe im Umkreis von 8 Blöcken.'
    - '&7Abklingzeit: 75 Sekunden.'
    item-model: mobarmy:chaos_crown
    drops:
    - source: boss
      amount: 1
      chance: 1.0
    use:
      consume: 0
      radius: 8
      cooldown-seconds: 75
      message: '&dDie Chaos-Krone stärkt deine Gruppe.'
      effects:
      - type: SPEED
        seconds: 10
        amplifier: 0
      - type: HASTE
        seconds: 10
        amplifier: 0
  raid_shard:
    material: PRISMARINE_SHARD
    name: '&5Raidsplitter'
    drops:
    - source: mob
      amount: 1
      chance: 0.15
    - source: miniboss
      amount: 3
      chance: 1.0
    item-model: mobarmy:raid_shard
    shop-token: true
    lore:
    - '&8Handelsware · Dungeon-Währung'
    - '&7Für den Verkauf in einem kompatiblen NPC-Shop.'
    - '&7Den Verkaufspreis bestimmt der jeweilige Shop.'
    - '&bSammeln, aufbewahren und später verkaufen.'
  boss_model:
    material: PAPER
    name: '&dChaoswächter-Modell'
    item-model: mobarmy:chaos_guardian
  frost_talisman:
    material: AMETHYST_SHARD
    name: '&bFrosttalisman'
    lore:
    - '&8Wiederverwendbares Kontrollrelikt'
    - '&7Rechtsklick: Gegner im Umkreis von 8 Blöcken'
    - '&7erhalten Langsamkeit II (6s); Bosse I (3s).'
    - '&bAbklingzeit: 40 Sekunden · bleibt erhalten.'
    item-model: mobarmy:frost_talisman
    drops:
    - source: miniboss
      stage: 2
      amount: 1
      chance: 1.0
    use:
      consume: 0
      cooldown-seconds: 40
      enemy-radius: 8
      enemy-slow-seconds: 6
      message: '&bDer Frosttalisman bremst nahe Raid-Gegner.'
      effects: []
  healing_bloom:
    material: AMETHYST_SHARD
    name: '&aLebensblüte'
    lore:
    - '&8Wiederverwendbares Heilrelikt'
    - '&7Rechtsklick: Regeneration II (6s).'
    - '&aWirkt auf deine Gruppe im Umkreis von 8 Blöcken.'
    - '&7Abklingzeit: 90 Sekunden · bleibt erhalten.'
    item-model: mobarmy:healing_bloom
    drops:
    - source: miniboss
      stage: 3
      amount: 1
      chance: 1.0
    use:
      consume: 0
      radius: 8
      cooldown-seconds: 90
      message: '&aDie Lebensblüte heilt deine Gruppe.'
      effects:
      - type: REGENERATION
        seconds: 6
        amplifier: 1
  gale_sigil:
    material: AMETHYST_SHARD
    name: '&3Windrune'
    lore:
    - '&8Wiederverwendbares Bewegungsrelikt'
    - '&7Rechtsklick: Tempo II + langsamer Fall (8s).'
    - '&3Zum Ausweichen und für sichere Windcharge-Sprünge.'
    - '&7Abklingzeit: 35 Sekunden · bleibt erhalten.'
    item-model: mobarmy:gale_sigil
    drops:
    - source: miniboss
      stage: 4
      amount: 1
      chance: 1.0
    use:
      consume: 0
      radius: 0
      cooldown-seconds: 35
      message: '&3Die Windrune verleiht dir Leichtigkeit.'
      effects:
      - type: SPEED
        seconds: 8
        amplifier: 1
      - type: SLOW_FALLING
        seconds: 8
        amplifier: 0
