# Demo arenas generate once. Set generate-demo: false for hand-built worlds.
# Rewards are chosen in the portal GUI; no automatic timer is applied.
timezone: Europe/Berlin
entry-timeout-seconds: 120
loot-timeout-seconds: 120
wave-delay-seconds: 4
wipe-cooldown-minutes: 30
ritual-world: world
maximum-ritual-mobs: 20
testing:
  solo: false
  disable-pvp: false
balance:
  hit-cap: 0.2
  mace-cap: 0.05
  boss-player-share: 0.4
  count-per-extra-player: 0.25
  health-per-extra-player: 0.04
  maximum-wave-mobs: 250
  minimum-spawn-distance: 8
  maximum-build-height: 2
  pearl-cooldown-seconds: 10
  apple-cooldown-seconds: 30
  apples-per-stage: 3
  potions-per-stage: 3
  totems-per-stage: 1
messages:
  join: '&dEine Gruppe hat das Portal betreten'
  stage: '&dStage {stage} ist abgeschlossen'
items:
  chaos_fragment:
    material: AMETHYST_SHARD
    name: '&dChaosfragment'
    lore:
    - '&7Miniboss-Beute'
    - '&7Rechtsklick auf einen Kessel in der Default-Welt'
    item-model: mobarmy:chaos_fragment
    drops:
    - source: miniboss
      stage: 1
      amount: 1
      chance: 1.0
    ritual:
      type: HUSK
      health: 80
      damage: 6
      name: '&5Fragmentwächter'
      result: ritual_core
  ritual_core:
    material: HEART_OF_THE_SEA
    name: '&bRitualkern'
    lore:
    - '&7Belohnung eines Kesselrituals'
    item-model: mobarmy:ritual_core
  chaos_crown:
    material: NETHER_STAR
    name: '&6Krone des Durcheinanders'
    lore:
    - '&7Beute des ersten Chaoswächter-Abschlusses'
    item-model: mobarmy:chaos_crown
    drops:
    - source: boss
      amount: 1
      chance: 1.0
  raid_shard:
    material: PRISMARINE_SHARD
    name: '&5Raidsplitter'
    drops:
    - source: mob
      amount: 1
      chance: 0.15
    - source: miniboss
      amount: 3
      chance: 1.0
  boss_model:
    material: PAPER
    name: '&dChaoswächter-Modell'
    item-model: mobarmy:chaos_guardian
