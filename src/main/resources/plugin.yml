name: DurcheinanderMobArmy
version: 1.8.0
main: de.yuuki.mobarmy.MobArmy
api-version: '26.3'
author: Yuuki
description: Configurable multi-week raids with parties, voting, loot and rituals.
commands:
  raid:
    description: Raid menu and administration
    usage: /raid help
  rezepte:
    description: Rezepte / recipes, equipment and ritual guide
    usage: /rezepte [items|gear|sets|rituals]
    aliases:
    - recipes
permissions:
  mobarmy.play:
    default: true
  mobarmy.admin:
    default: op
  mobarmy.timer:
    default: op
  mobarmy.item:
    default: op
  mobarmy.build:
    default: op
